name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # مقدار placeholder — کافی برای prisma generate/typecheck؛ migrate واقعی در این workflow اجرا نمی‌شود
      DATABASE_URL: "postgresql://user:password@localhost:5432/vitalis"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/vitalis"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      NEXTAUTH_SECRET: "ci-nextauth-secret-min-32-chars-long"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
